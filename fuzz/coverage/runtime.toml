# SPDX-License-Identifier: GPL-3.0-or-later
#
# Fuzz coverage manifest, runtime half (P8 exit criterion 2, decision 0043 §2): the parsers
# of tessera-net, tessera-protocol, tessera-settings, tessera-input, tessera-script,
# tessera-plugins, tessera-ui, tessera-render and of the apps tessera-client,
# tessera-server, tessera-loadtest, tessera-dattool and tessera-explorer, each with the fuzz
# target that reaches it or an exemption naming the target or test that covers it.
# The format and the checks are those of tools/check-fuzz-coverage.sh (its header; also
# tools/README.md). The data half (dat, formats, props, text, material, mesh, ...) is in
# the other manifests of this directory; crates/compat is outside P8 (M8).
#
# Conventions of this file:
# - `entry` names the decoding entry points of `file` as crate paths.
# - Most app targets include the app's module by path (as for ui_host/placements.rs and
#   commands/uiscale.rs). Readers in modules that need the window, GPU or GUI stack are
#   reached by linking the app's library: fuzz/ depends on tessera-client, tessera-explorer
#   and tessera-loadtest for `client_text_readers`, `explorer_text_readers` and
#   `app_arg_readers` (P8 exit verification, 2026-10-24). A parser that hands its whole
#   input to a fuzzed inner parser is exempt with that target. A reader that no target
#   reaches is recorded with `gap` (naming the unit test that checks it today), never as an
#   exemption: decision 0043 §2.3 allows only exemptions that name a covering target, and
#   the checker lists every gap as a failure (g), so criterion 2 is not met while any `gap`
#   remains.
# - Fuzz targets that drive state machines or geometry rather than a parser are listed in
#   [[skip]] tables by their source file, so check (b) knows them.

