# SPDX-License-Identifier: GPL-3.0-or-later
#
# Fuzz coverage manifest, data half (P8 exit criterion 2; checked by
# tools/check-fuzz-coverage.sh, format in its --help). The parsers of the data crates:
# dat, formats, props, text, havok, anim, material, mesh, wstate, wvm, gamedata,
# particles, scriptgraph, world, terrain, physics, install, assets, entity and audio
# (sound records, ABC). One [[parser]] per decoding entry point (or group of entry
# points in one file) with the fuzz target that drives it; `exempt` names the target or
# test that covers an entry point without a target of its own. A thin wrapper is listed
# with the target of what it wraps: `parse_expecting` (parse, then compare the record's
# DID with the expected one), the `decode_*` helpers and `Record::parse` reached through
# them, a default-options variant. Targets over decoded
# values (animation, particles, terrain, physics, the audio engine) are listed with the
# records or settings their values come from.
#
# Every exemption names the fuzz target(s) that cover its entry points; a parser without a
# fuzz target would be a `gap` (none here). A [[package]] table records a package with no
# parser of its own; the checker still scans it. A [[skip]] with `fns` covers only the named
# functions of its files.
#
# The runtime crates are in fuzz/coverage/runtime.toml.

