[package]
name = "tessera-world"
description = "World model: coordinates and map coordinates, landblock IDs, streaming rings, landblock bundles, block-map lookups, area names, minimap tiles"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tessera-assets.workspace = true
tessera-dat.workspace = true
tessera-formats.workspace = true
tessera-havok.workspace = true
# Sibling allowance (ARCHITECTURE §3.1, ROADMAP M4.5): scenery generation uses the terrain
# collision queries, and bundles carry collision sets built on the workers.
tessera-physics.workspace = true
tessera-props.workspace = true
tessera-text.workspace = true
tessera-wstate.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
# Real-data test only (tests/collision_real_data.rs): terrain render triangles are compared
# with the collision triangles (ROADMAP M4.5 exit criterion 2). The library does not depend
# on the terrain mesher.
tessera-terrain.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
