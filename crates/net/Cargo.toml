# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "tessera-net"
description = "Transport-agnostic session layer, local sandbox backend, test-server backend and reliable-datagram transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["remote", "scenario"]
# The test-server backend (`tessera_net::remote`, decision 0030): QUIC via quinn, TLS 1.3
# via rustls on ring, and a tokio current_thread runtime on a dedicated network thread.
# Consumers that need only the sandbox can turn default features off.
remote = ["dep:tokio", "dep:quinn", "tessera-protocol/transport"]
# The scenario feed (`tessera_net::scenario`, docs/specs/scenario-feed.md): the scenario
# parser, selector resolution contract, the run-time feed of the sandbox backend, the
# canonical event log and the headless driver. tessera-server never links it (LEGAL.md
# §11.1 rule 5).
scenario = []

[dependencies]
tessera-protocol.workspace = true
thiserror.workspace = true
tracing.workspace = true
quinn = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
proptest.workspace = true
quinn.workspace = true
tessera-protocol = { workspace = true, features = ["transport"] }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }

[lints]
workspace = true
