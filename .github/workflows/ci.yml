# SPDX-License-Identifier: GPL-3.0-or-later
#
# Continuous integration. Every job must pass before merge, except the ones marked
# "advisory" below. The same checks run locally:
#
#   cargo fmt --all -- --check
#   cargo clippy --workspace --all-targets -- -D warnings
#   cargo test --workspace                   (TESSERA_BLESS=1 regenerates golden images)
#   cargo deny check                         (and --manifest-path fuzz/Cargo.toml)
#   tools/check-content.sh                   forbidden content and trademark words
#   tools/check-spdx.sh                      SPDX headers
#   tools/check-dco.sh origin/main           Signed-off-by and clean-room trailers (unpushed
#                                            commits; --all checks the whole history)
#   (cd fuzz && cargo fmt --all -- --check && cargo clippy --bins --locked -- -D warnings)
#   tools/fuzz-smoke.sh -t 30                short run of every fuzz target
#
# The toolchain is the exact version pinned in rust-toolchain.toml (bump it on purpose);
# the MSRV job checks rust-version from Cargo.toml (1.90) and apps/explorer (1.95).
#
# Cost (private repository: billed minutes, macOS 10x, Windows 2x): pull requests run
# Linux only and skip fuzzing; pushes to main, the weekly schedule and manual runs add
# Windows, macOS and the fuzz smoke test. Every job has a timeout.
#
# No job has access to a game install: TESSERA_GAME_DIR is never set here, so real-data
# tests skip themselves. Never add game files, captures or secrets to CI.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1" # weekly full run (all OSes, longer fuzzing)

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Superseded pull-request runs are cancelled; every push to main keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # Full debuginfo makes test binaries 350-500 MB each; line tables keep backtraces.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # ------------------------------------------------------------------------------------
  # Repository hygiene (no Rust build needed)
  # ------------------------------------------------------------------------------------
  content:
    name: Forbidden content
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Self-test the guard
        run: tools/check-content.sh --self-test
      - name: Scan the tree
        run: tools/check-content.sh

  spdx:
    name: SPDX / REUSE
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: SPDX headers on source files
        run: tools/check-spdx.sh
      # REUSE 3.x compliance: LICENSES/ and REUSE.toml at the root.
      - name: reuse lint
        if: ${{ hashFiles('LICENSES/**') != '' }}
        uses: fsfe/reuse-action@v5

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000') }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check Signed-off-by and clean-room trailers
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # After a force-push the old tip may be gone; then check the pushed tip only.
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "::warning::base $BASE is not in the history (force-push?); checking $HEAD only"
            if git rev-parse -q --verify "$HEAD^" >/dev/null; then BASE="$HEAD^"; else BASE=--all; fi
          fi
          if [ "$BASE" = --all ]; then tools/check-dco.sh --all "$HEAD"; else tools/check-dco.sh "$BASE" "$HEAD"; fi

  # ------------------------------------------------------------------------------------
  # Rust
  # ------------------------------------------------------------------------------------
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Read the pinned toolchain
        id: toolchain
        run: echo "version=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - name: fuzz workspace
        working-directory: fuzz
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Read the pinned toolchain
        id: toolchain
        run: echo "version=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            fuzz
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: all features
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: fuzz workspace (stable type-check)
        working-directory: fuzz
        run: cargo clippy --bins --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # Windows and macOS have not had a green run yet; advisory until they have.
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        # Pull requests: Linux only. Main, schedule, manual runs: all three.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "windows-latest", "macos-latest"]') }}
    steps:
      - uses: actions/checkout@v5
      - name: Read the pinned toolchain
        id: toolchain
        shell: bash
        run: echo "version=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Software Vulkan for headless render tests (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
      - name: Build
        run: cargo build --workspace --all-targets --locked
      # Golden images (crates/render/tests/golden/, apps/client/tests/golden/) are the
      # M0 headless-render gate. On Linux they must run on lavapipe: TESSERA_REQUIRE_GPU
      # turns "no adapter, skipping" into a failure. Other runners' software adapters
      # (WARP, the macOS paravirtual GPU) are not the reference, so the golden comparisons
      # are skipped there; every other render test still runs.
      - name: Test
        shell: bash
        env:
          TESSERA_REQUIRE_GPU: ${{ runner.os == 'Linux' && '1' || '' }}
          SKIP_GOLDEN: ${{ runner.os != 'Linux' && '--skip matches_golden' || '' }}
        run: cargo test --workspace --locked -- $SKIP_GOLDEN
      - name: Keep golden-image diffs
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v5
        with:
          name: golden-diffs
          path: target/tmp/golden/
          if-no-files-found: ignore
      - name: Docs build (warnings are errors)
        if: runner.os == 'Linux'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  # Workspace MSRV = rust-version in Cargo.toml; apps/explorer declares its own (eframe/egui
  # need a newer compiler), so it is checked separately on that version.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Read rust-version
        id: msrv
        run: |
          echo "workspace=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml | head -n 1)" >> "$GITHUB_OUTPUT"
          echo "explorer=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' apps/explorer/Cargo.toml | head -n 1)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.explorer }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.workspace }}
      - name: cargo check on the workspace MSRV (without the explorer)
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.workspace }}
        run: cargo check --workspace --exclude tessera-explorer --all-targets --locked
      - name: cargo check the explorer on its own MSRV
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.explorer }}
        run: cargo check -p tessera-explorer --all-targets --locked

  # ------------------------------------------------------------------------------------
  # Supply chain: licences (GPLv3-compatible only), bans, sources, advisories
  # ------------------------------------------------------------------------------------
  deny:
    name: cargo-deny (${{ matrix.checks }}, ${{ matrix.manifest }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        manifest: [Cargo.toml, fuzz/Cargo.toml]
        checks: [advisories, bans licenses sources]
    # A newly published advisory must not block unrelated pull requests; it is still
    # reported in the job summary and must be triaged.
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: ${{ matrix.manifest }}
          command: check ${{ matrix.checks }}
          # deny.toml at the repository root also applies to fuzz/ (found by walking up).
          arguments: --all-features

  # ------------------------------------------------------------------------------------
  # Fuzzing smoke test: every target builds with cargo-fuzz (AddressSanitizer) and survives
  # 10 s (60 s on the weekly schedule). Not on pull requests (billed minutes).
  # ------------------------------------------------------------------------------------
  fuzz:
    name: fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [clippy]
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo fuzz build
        working-directory: fuzz
        run: cargo +nightly fuzz build
      - name: Run every target
        env:
          FUZZ_SECS: ${{ github.event_name == 'schedule' && '60' || '10' }}
        run: tools/fuzz-smoke.sh -t "$FUZZ_SECS" -j 2
      - name: Keep crash inputs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
