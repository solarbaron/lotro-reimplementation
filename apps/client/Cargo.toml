# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "tessera-client"
description = "The Tessera game client: window, frame loop, subsystem wiring and the offline world walker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "tessera_client"
path = "src/lib.rs"

[[bin]]
name = "tessera-client"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
tessera-anim.workspace = true
tessera-assets.workspace = true
tessera-dat.workspace = true
tessera-entity.workspace = true
tessera-formats.workspace = true
tessera-havok.workspace = true
tessera-input = { workspace = true, features = ["winit"] }
tessera-install.workspace = true
tessera-material.workspace = true
tessera-mesh.workspace = true
tessera-net.workspace = true
# Walk mode on collision (ROADMAP M4.5, decision 0013): the character controller.
tessera-physics.workspace = true
tessera-props.workspace = true
tessera-render.workspace = true
tessera-script.workspace = true
tessera-settings.workspace = true
tessera-terrain.workspace = true
tessera-world.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
winit = "0.30"
# Public-domain 8 × 8 bitmap glyphs (MIT-licensed crate) for the walker HUD.
font8x8 = { version = "0.3", default-features = false }
# Screenshots (`--screenshot`).
png = "0.18"
# Character names are matched by their NFC lower-case key (`--character`).
unicode-normalization = "0.1"

[target.'cfg(unix)'.dependencies]
# Terminal echo off for the test-server password prompt (`--server`).
rustix = { version = "1", default-features = false, features = ["std", "termios"] }

[dev-dependencies]
tempfile = "3"
# In-process test server and its types for the headless network test (`tests/net_server.rs`).
tessera-protocol.workspace = true
tessera-server.workspace = true

[lints]
workspace = true
