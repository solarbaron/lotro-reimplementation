# SPDX-License-Identifier: GPL-3.0-or-later
#
# Fuzz coverage manifest, tessera-compat half (M8, decisions 0034 and 0042): the parsers of
# the official-server compatibility crate, each with the fuzz target that reaches it or an
# exemption naming the target that covers it. The format and the checks are those of
# tools/check-fuzz-coverage.sh (its header; also tools/README.md). Every input here is
# hostile: server datagrams and SOAP/XML replies, the chat server's events, the user's
# install (its launcher configuration, the `.dat` superblock and bootstrap records, the
# client's PE version resource) and the consent record.
#
# Conventions of this file:
# - `entry` names the decoding entry points of `file` as crate paths. The world and play
#   messages have one `decode` (from a `WireReader`) and one `from_bytes` (a whole payload)
#   per message type; every message type the file defines is listed.
# - A decoder reached only through a listed one (an inner record, a reader primitive) is
#   listed with the target that reaches it through the outer decoder.
# - Functions with a parser-like name that take no hostile bytes (numeric conversions of a
#   decoded value, a directory listing by file name) are in [[skip]] tables with fns.

# =========================================================================================
# login: SOAP/XML replies, launcher configuration, `.dat` bootstrap records
# =========================================================================================

[[parser]]
crate = "tessera-compat"
file = "crates/compat/src/login.rs"
entry = [
    "tessera_compat::login::RemoteLauncherConfig::parse",
    "tessera_compat::login::WorldStatus::parse",
    "tessera_compat::login::QueueResult::parse",
    "tessera_compat::login::LoginHost::parse",
    "tessera_compat::login::parse_get_datacenters_response",
    "tessera_compat::login::parse_login_account_response",
