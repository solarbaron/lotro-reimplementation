[package]
name = "tessera-dattool"
description = "Command-line inspector for .dat/.datx archives of a user's own install (read-only)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "tessera-dattool"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tessera-dat.workspace = true
tessera-formats.workspace = true
tessera-install.workspace = true
serde_json = "1"
png = "0.18"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
# The synthetic archive writer shared from crates/dat/tests/common needs zlib.
flate2.workspace = true

[lints]
workspace = true
