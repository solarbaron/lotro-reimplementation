# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "tessera-render"
description = "wgpu renderer foundation for the Tessera client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
glam = { version = "0.33", features = ["bytemuck"] }
pollster.workspace = true
thiserror.workspace = true
tracing.workspace = true
wgpu = "30"

[dev-dependencies]
png = "0.18"
tracing-subscriber.workspace = true
# Real-data test only (tests/real_data.rs): real surfaces through every mesh pipeline.
tessera-dat.workspace = true
tessera-formats.workspace = true
# Real-data test only (tests/skinned_real_data.rs): skin streams of real mesh records.
tessera-mesh.workspace = true
# Real-data test only (tests/terrain_layers_golden.rs): real landblock layers resolved by
# the terrain crate, drawn through the terrain layer pipeline. Never a normal dependency.
tessera-terrain.workspace = true

# CPU cost of skinned drawing (50 characters x 30 parts); a plain binary, no harness.
[[bench]]
name = "skinned"
harness = false

[lints]
workspace = true
