# SPDX-License-Identifier: GPL-3.0-or-later
[workspace]
resolver = "3"
members = [
    "crates/dat",
    "crates/formats",
    "crates/install",
    "crates/net",
    "crates/render",
    "crates/script",
    "crates/props",
    "crates/text",
    "crates/assets",
    "crates/material",
    "crates/settings",
    "crates/mesh",
    "crates/world",
    "crates/terrain",
    "crates/wstate",
    "crates/input",
    "crates/havok",
    "crates/anim",
    "crates/entity",
    "crates/ui",
    "crates/plugins",
    "crates/physics",
    "crates/protocol",
    "crates/wvm",
    "crates/audio",
    "crates/scriptgraph",
    "crates/particles",
    "crates/gamedata",
    "crates/compat",
    "apps/dattool",
    "apps/client",
    "apps/explorer",
    "apps/server",
    "apps/loadtest",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-or-later"
repository = "https://example.invalid/tessera"
publish = false

[workspace.dependencies]
tessera-dat = { path = "crates/dat" }
tessera-formats = { path = "crates/formats" }
tessera-install = { path = "crates/install" }
tessera-net = { path = "crates/net" }
tessera-render = { path = "crates/render" }
tessera-script = { path = "crates/script" }
tessera-props = { path = "crates/props" }
tessera-text = { path = "crates/text" }
tessera-assets = { path = "crates/assets" }
tessera-material = { path = "crates/material" }
tessera-settings = { path = "crates/settings" }
tessera-mesh = { path = "crates/mesh" }
tessera-world = { path = "crates/world" }
tessera-terrain = { path = "crates/terrain" }
tessera-wstate = { path = "crates/wstate" }
tessera-input = { path = "crates/input" }
tessera-havok = { path = "crates/havok" }
tessera-anim = { path = "crates/anim" }
tessera-entity = { path = "crates/entity" }
tessera-ui = { path = "crates/ui" }
tessera-plugins = { path = "crates/plugins" }
tessera-physics = { path = "crates/physics" }
tessera-protocol = { path = "crates/protocol" }
tessera-server = { path = "apps/server" }
tessera-wvm = { path = "crates/wvm" }
tessera-audio = { path = "crates/audio" }
tessera-scriptgraph = { path = "crates/scriptgraph" }
tessera-particles = { path = "crates/particles" }
tessera-gamedata = { path = "crates/gamedata" }
tessera-compat = { path = "crates/compat" }

anyhow = "1"
bitflags = "2"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
memmap2 = "0.9"
pollster = "1"
proptest = "1"
# Seeded small RNG for script-graph draws and sound pitch/offset variance (M6).
rand = { version = "0.9", default-features = false, features = ["std", "small_rng"] }
thiserror = "2"
tracing = "0.1"
# The ban-risk consent of tessera-compat (official-entry.md §5.3, §5.6): config directory,
# random key, record document, normalisation form C, and on Unix-like systems the file flags,
# user ID and host name of the record's binding.
dirs = "6"
getrandom = "0.4"
libc = "0.2"
rustix = { version = "1", default-features = false }
toml = "1"
unicode-normalization = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# M7 networking candidates (decision 0030 picks the transport; entries nobody uses are not
# resolved). TLS stays on rustls with the ring provider: aws-lc-sys carries the OpenSSL
# licence, which deny.toml rejects, so default features are off. argon2 defaults are off
# too, so each member lists exactly the features it uses.
argon2 = { version = "0.6", default-features = false }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
sha2 = "0.10"
snow = "0.10"
tokio = { version = "1", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = "line-tables-only"
