# SPDX-License-Identifier: GPL-3.0-or-later
# Fuzz targets for every parser of untrusted input (CLAUDE.md). Run with
# `cargo +nightly fuzz run <target>` (needs cargo-fuzz and a nightly toolchain); see
# fuzz/README.md. This is its own workspace so the main workspace builds on stable
# without it.

[package]
name = "tessera-fuzz"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = { version = "0.4", features = ["arbitrary-derive"] }
tessera-dat = { path = "../crates/dat" }
tessera-formats = { path = "../crates/formats" }
tessera-install = { path = "../crates/install" }
tessera-net = { path = "../crates/net" }
tessera-script = { path = "../crates/script" }
tessera-props = { path = "../crates/props" }
tessera-text = { path = "../crates/text" }
tessera-material = { path = "../crates/material" }
tessera-settings = { path = "../crates/settings" }
tessera-dattool = { path = "../apps/dattool" }
tessera-render = { path = "../crates/render" }
tessera-mesh = { path = "../crates/mesh" }

# Not a member of the root workspace.
[workspace]
members = ["."]

[profile.release]
debug = 1

