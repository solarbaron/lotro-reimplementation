[package]
name = "tessera-assets"
description = "Asset pipeline: worker pool with priorities, cancellation and de-duplication, decoded-asset LRU cache, completion queue"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["formats"]
# Ready-made decoders built on `tessera-formats` (render surfaces to RGBA8).
formats = ["dep:tessera-formats"]

[dependencies]
tessera-dat.workspace = true
tessera-formats = { workspace = true, optional = true }
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
# The synthetic archive writer of `tessera-dat`'s own tests is reused (included by path)
# to build in-memory archives; it needs flate2.
flate2.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
