# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "tessera-client"
description = "The Tessera game client: window, frame loop, subsystem wiring and the offline world walker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "tessera_client"
path = "src/lib.rs"

[[bin]]
name = "tessera-client"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
tessera-anim.workspace = true
tessera-assets.workspace = true
tessera-audio.workspace = true
# Official play (docs/specs/official-entry.md): the ban-risk consent, the consent proof and
# the compatibility backend (placeholder connector only; decision 0041). Never linked by
# tessera-server.
tessera-compat.workspace = true
tessera-dat.workspace = true
tessera-entity.workspace = true
tessera-formats.workspace = true
# Scenario selectors resolved against the install (`--scenario`, `docs/specs/scenario-feed.md`
# §8.6); client and tools only, never linked by tessera-server.
tessera-gamedata.workspace = true
tessera-havok.workspace = true
tessera-input = { workspace = true, features = ["winit"] }
tessera-install.workspace = true
tessera-material.workspace = true
tessera-mesh.workspace = true
tessera-net.workspace = true
# Particle effects started by script tables (`particle-runtime.md`).
tessera-particles.workspace = true
# Walk mode on collision (ROADMAP M4.5, decision 0013): the character controller.
tessera-physics.workspace = true
tessera-props.workspace = true
tessera-render.workspace = true
tessera-plugins.workspace = true
tessera-scriptgraph.workspace = true
tessera-settings.workspace = true
tessera-terrain.workspace = true
# String resolution for the game UI (src/ui_host).
tessera-text.workspace = true
# Native panels (src/panels): the game UI core and its game widgets.
tessera-ui.workspace = true
tessera-world.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
winit = "0.30"
# Public-domain 8 × 8 bitmap glyphs (MIT-licensed crate) for the walker HUD.
font8x8 = { version = "0.3", default-features = false }
# Screenshots (`--screenshot`).
png = "0.18"
# Character names are matched by their NFC lower-case key (`--character`).
unicode-normalization = "0.1"

[target.'cfg(unix)'.dependencies]
# Terminal echo off for the test-server password prompt (`--server`).
rustix = { version = "1", default-features = false, features = ["std", "termios"] }

[features]
default = []
## Audio output through the system's device (cpal: ALSA on Linux; decision 0019). Off by
## default, so that a plain workspace build and `cargo test --workspace` need no system
## audio libraries (decision 0019, Decision 1 and Consequences). Without it the client runs
## the null, offline and disabled audio backends only: `--audio auto` falls back to null,
## `--audio device` turns audio off. Windowed builds with sound:
## `cargo run --release -p tessera-client --features audio-device`.
audio-device = ["tessera-audio/device"]

[dev-dependencies]
tempfile = "3"
# The record-building helpers of `consent::test_support` for the official-entry tests
# (OE-T5, OE-T6 (c)); dev-dependency features never reach the client binary.
tessera-compat = { workspace = true, features = ["test-support"] }
# In-process test server and its types for the headless network test (`tests/net_server.rs`).
tessera-protocol.workspace = true
tessera-server.workspace = true
# A synthetic, empty object store for the scenario resolver's unit tests.
tessera-wstate.workspace = true

[lints]
workspace = true
