# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "tessera-explorer"
description = "GUI asset browser for the archives of an install: archive tree, DID search, hex, textures, icons, strings, property sets and a 3D mesh and material viewer, landblock scenery, water and collision views, the sky timeline"
version.workspace = true
edition.workspace = true
# eframe/egui 0.36 need Rust 1.95; the explorer is a tool, so it may require a newer
# compiler than the library crates (workspace MSRV).
rust-version = "1.95"
license.workspace = true
publish.workspace = true

[lib]
name = "tessera_explorer"
path = "src/lib.rs"

[[bin]]
name = "tessera-explorer"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tessera-dat.workspace = true
tessera-formats.workspace = true
tessera-install.workspace = true
tessera-props.workspace = true
tessera-text.workspace = true
tessera-assets.workspace = true
tessera-material.workspace = true
tessera-settings.workspace = true
# Optional UI-scale preview (src/scale_preview.rs): the UI-scaling geometry core only
# (coordinate spaces, the UI screen, fit rules); no element tree, no canvas, no wgpu.
tessera-ui.workspace = true
tessera-mesh.workspace = true
tessera-render.workspace = true
# M4 character viewer and animation browser: skeletons, clips, sampling on workers.
tessera-havok.workspace = true
tessera-anim.workspace = true
# M4.5 world views: landblock scenery, water and collision (bundles built on the workers),
# the sky and day-description timeline, and collision overlays in the 3D view.
tessera-world.workspace = true
tessera-physics.workspace = true
# Gameplay view: the class library (parent map) for the combat families' class ancestry.
tessera-wstate.workspace = true
# Particle preview of 0x39 records and `--particles DID --sheet`: the particle runtime.
tessera-particles.workspace = true
# Tooltip preview on the item card (`item-tooltips.md`): the examination tooltip model.
tessera-gamedata.workspace = true
# No "default_fonts": egui's bundled fonts are OFL-1.1 / Ubuntu Font Licence, outside the
# licence allow list (deny.toml). UI fonts come from the system at run time (src/fonts.rs).
eframe = { version = "0.36", default-features = false, features = [
    "wgpu",
    "wayland",
    "x11",
] }
# PNG output of `--screenshot` (MIT/Apache-2.0).
png = "0.18"
# Checks system font files before egui loads them (egui aborts on a font it cannot
# parse). Already in the tree through egui's text layer (MIT OR Apache-2.0).
skrifa = { version = "0.44", default-features = false, features = ["std", "autohint_shaping"] }

# Screenshot mode selects X11 (`EventLoopBuilderExtX11`) so headless runs are not
# placed by a Wayland compositor; already in the tree through eframe (Apache-2.0).
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
winit = { version = "0.30", default-features = false, features = ["x11"] }

[dev-dependencies]
# The synthetic archive writer of `tessera-dat`'s own tests is reused (included by path)
# to build in-memory archives; it needs flate2.
flate2.workspace = true

[lints]
workspace = true
