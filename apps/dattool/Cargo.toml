[package]
name = "tessera-dattool"
description = "Command-line inspector for .dat/.datx archives of a user's own install (read-only)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The snapshot file format lives in a small library so `fuzz/` can drive its decoder.
[lib]
name = "tessera_dattool"
path = "src/lib.rs"

[[bin]]
name = "tessera-dattool"
path = "src/main.rs"
# The library has the same crate name; only its docs are built.
doc = false

[dependencies]
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tessera-dat.workspace = true
tessera-formats.workspace = true
tessera-install.workspace = true
serde_json = "1"
sha2 = "0.10"
thiserror.workspace = true
flate2.workspace = true
png = "0.18"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[lints]
workspace = true
