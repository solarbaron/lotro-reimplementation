# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "tessera-material"
description = "Materials and images built from render surfaces: surface/material/shader records, effective parameters, feature flags, float curves over time, texture transforms, lighting inputs, water parameters, dyes, layered icon composition, mip-chain helpers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tessera-dat.workspace = true
tessera-formats.workspace = true
thiserror.workspace = true
tracing.workspace = true
# Skin and plugin JPEG files (ui_image). Pure Rust; MIT OR Apache-2.0 OR Zlib.
zune-jpeg = "0.5.15"

[dev-dependencies]
proptest.workspace = true
# Real-data tests only (tests/real_data.rs): property sets by name.
tessera-props.workspace = true
# PNG output of sample composites in the real-data test (zlib stream).
flate2.workspace = true
# Synthetic JPEG files for the ui_image tests (encoder only; same crate and version as
# tessera-formats' optional JPEG support).
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[lints]
workspace = true
