# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "tessera-input"
description = "Windowing-agnostic input: actions, contexts, bindings, Tessera's keymap file, fly and walk controllers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# `winit` adapter module: converts winit window/device events into `RawEvent`s.
winit = ["dep:winit"]

[dependencies]
bitflags.workspace = true
glam = "0.33"
# Primitives (VLE, Pascal strings, TSize) for the read-only key-map and
# action-map record decoders of the importer (keymap.md §12.9, §12.10).
tessera-formats.workspace = true
tessera-settings.workspace = true
thiserror.workspace = true
toml = "1"
tracing.workspace = true
winit = { version = "0.30", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
proptest.workspace = true
tempfile = "3"
# Real-data tests of the importer only (tests/import_real_data.rs).
tessera-dat.workspace = true

[lints]
workspace = true
